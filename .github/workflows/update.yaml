name: Update Melia

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update package to latest version if available
        id: update
        run: ./bin/update

      - name: Update flake inputs
        if: steps.update.outputs.updated == 'true'
        run: nix flake update

      - name: Check if flake evaluates
        if: steps.update.outputs.updated == 'true'
        run: nix flake check --all-systems

      - name: Check if packages build
        if: steps.update.outputs.updated == 'true'
        run: nix build

      - name: Commit and push changes
        if: steps.update.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          VERSION=$(nix eval --raw .#packages.x86_64-linux.melia.version)
          git commit -m "chore: update melia to v$VERSION"
          git push
